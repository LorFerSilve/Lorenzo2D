name: Source export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export-source:
    name: Export source snapshot
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lorenzo2d-source
          path: |
            .
            !.git
          if-no-files-found: error
          retention-days: 1
