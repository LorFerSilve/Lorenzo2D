name: Phase 13 formatter diagnostic

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned formatter
        run: python3 -m pip install --break-system-packages clang-format==22.1.3
      - name: Print canonical editor test formatting diff
        run: |
          clang-format -i tools/editor/tests/EditorFoundationTests.cpp
          git diff -- tools/editor/tests/EditorFoundationTests.cpp
          test -z "$(git status --short -- tools/editor/tests/EditorFoundationTests.cpp)"
