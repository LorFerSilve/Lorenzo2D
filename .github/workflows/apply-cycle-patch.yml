name: Apply regression split patch

on:
  push:
    branches:
      - improve/split-regression-suites

permissions:
  contents: write

jobs:
  apply-patch:
    name: Apply validated cycle patch
    runs-on: ubuntu-24.04

    steps:
      - name: Check out cycle branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reassemble and validate patch
        run: |
          cat .github/cycle-patch/*.part > /tmp/regression-split.patch.gz.b64
          base64 --decode /tmp/regression-split.patch.gz.b64 \
            | gzip --decompress > /tmp/regression-split.patch
          git apply --check /tmp/regression-split.patch

      - name: Apply patch and remove bootstrap files
        run: |
          git apply /tmp/regression-split.patch
          rm -rf .github/cycle-patch
          rm -f .github/workflows/source-export.yml
          rm -f .github/workflows/apply-cycle-patch.yml
          rm -f tests/.cycle-scope.md tests/.cycle-plan.md

      - name: Verify final scope
        run: |
          test ! -e .github/cycle-patch
          test ! -e .github/workflows/source-export.yml
          test ! -e .github/workflows/apply-cycle-patch.yml
          test ! -e tests/.cycle-scope.md
          test ! -e tests/.cycle-plan.md
          test ! -e tests/Lorenzo2DTests.cpp
          test -e tests/TestSupport.hpp
          test -e tests/Lorenzo2DCoreTimingTests.cpp
          test -e tests/Lorenzo2DEcsSceneTests.cpp
          test -e tests/Lorenzo2DPhysicsIntegrationTests.cpp
          test -e tests/Lorenzo2DTilemapTests.cpp
          git status --short

      - name: Commit final cycle changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split broad regression suite by subsystem"
          git push origin HEAD:improve/split-regression-suites
