name: Phase 13.4 roadmap closeout

on:
  push:
    branches:
      - phase-13.4-roadmap-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-13.4-roadmap-closeout
          fetch-depth: 0
      - name: Apply Phase 13.4 roadmap closeout
        run: python3 .github/phase-13.4-roadmap-closeout.py
      - name: Commit roadmap closeout and remove helpers
        run: |
          git rm .github/workflows/phase-13.4-roadmap-closeout.yml
          git rm .github/phase-13.4-roadmap-closeout.py
          git add docs/post-1.0-roadmap.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close out Phase 13.4 roadmap state"
          git push origin HEAD:phase-13.4-roadmap-closeout
