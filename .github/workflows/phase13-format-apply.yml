name: Phase 13.1 format apply

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned formatter
        run: python3 -m pip install --break-system-packages clang-format==22.1.3
      - name: Apply canonical Phase 13.1 formatting
        run: |
          clang-format -i \
            tools/editor/src/EditorDocument.cpp \
            tools/editor/src/SceneHierarchyModel.cpp \
            tools/editor/src/main.cpp \
            tools/editor/tests/EditorFoundationTests.cpp
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/editor/src/EditorDocument.cpp \
            tools/editor/src/SceneHierarchyModel.cpp \
            tools/editor/src/main.cpp \
            tools/editor/tests/EditorFoundationTests.cpp
          git commit -m "Apply clang-format to Phase 13.1 editor foundation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
