name: Phase 10 format diagnostic

on:
  push:
    branches:
      - diag/phase10-format

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --break-system-packages clang-format==22.1.3
      - name: Format Phase 10 files
        run: |
          clang-format -i \
            benchmarks/Lorenzo2DPhase10Benchmarks.cpp \
            include/Lorenzo2D/Save/SaveGame.hpp \
            src/Lorenzo2D/Audio/AudioSystem.cpp \
            src/Lorenzo2D/Save/SaveGame.cpp \
            src/Lorenzo2D/UI/UiCanvas2D.cpp \
            tests/consumers/package/main.cpp \
            tests/consumers/subproject/main.cpp
          git diff -- \
            benchmarks/Lorenzo2DPhase10Benchmarks.cpp \
            include/Lorenzo2D/Save/SaveGame.hpp \
            src/Lorenzo2D/Audio/AudioSystem.cpp \
            src/Lorenzo2D/Save/SaveGame.cpp \
            src/Lorenzo2D/UI/UiCanvas2D.cpp \
            tests/consumers/package/main.cpp \
            tests/consumers/subproject/main.cpp
