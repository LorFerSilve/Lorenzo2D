name: Phase 13.10 format helper

on:
  push:
    branches:
      - phase-13.10-rotation-scale-gizmos

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-13.10-rotation-scale-gizmos
      - name: Install pinned clang-format
        run: python3 -m pip install --break-system-packages clang-format==22.1.3
      - name: Format Phase 13.10 sources
        run: |
          clang-format -i \
            tools/editor/include/Lorenzo2DEditor/ViewportTransformModel.hpp \
            tools/editor/src/ViewportTransformModel.cpp \
            tools/editor/tests/RotationScaleGizmoTests.cpp
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/editor/include/Lorenzo2DEditor/ViewportTransformModel.hpp \
            tools/editor/src/ViewportTransformModel.cpp \
            tools/editor/tests/RotationScaleGizmoTests.cpp
          git commit -m "Apply clang-format to Phase 13.10 sources"
          git push origin HEAD:phase-13.10-rotation-scale-gizmos
