name: Phase 13.5 formatter fix

on:
  push:
    branches:
      - phase-13.5-tilemap-authoring
    paths:
      - .github/workflows/phase-13.5-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-13.5-tilemap-authoring

      - name: Install exact CI formatter
        run: python3 -m pip install --break-system-packages clang-format==22.1.3

      - name: Format Phase 13.5 C++ files
        run: |
          clang-format -i \
            tools/editor/include/Lorenzo2DEditor/TilemapAuthoringModel.hpp \
            tools/editor/src/TilemapAuthoringModel.cpp \
            tools/editor/tests/TilemapAuthoringTests.cpp

      - name: Commit formatting and remove helper workflow
        run: |
          rm .github/workflows/phase-13.5-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/editor/include/Lorenzo2DEditor/TilemapAuthoringModel.hpp \
            tools/editor/src/TilemapAuthoringModel.cpp \
            tools/editor/tests/TilemapAuthoringTests.cpp \
            .github/workflows/phase-13.5-format-fix.yml
          git commit -m "Apply exact CI formatting"
          git push origin HEAD:phase-13.5-tilemap-authoring
