name: Phase 13.4 formatter fix

on:
  push:
    branches:
      - phase-13.4-asset-browser-picking

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-13.4-asset-browser-picking
          fetch-depth: 0
      - name: Install exact CI formatter
        run: python3 -m pip install --break-system-packages clang-format==22.1.3
      - name: Format Phase 13.4 C++ files
        run: |
          clang-format -i \
            tools/editor/include/Lorenzo2DEditor/AssetBrowserModel.hpp \
            tools/editor/src/AssetBrowserModel.cpp \
            tools/editor/src/AssetPickingModel.cpp \
            tools/editor/src/main.cpp \
            tools/editor/tests/AssetBrowserTests.cpp
      - name: Commit exact formatting and remove helper workflow
        run: |
          git rm .github/workflows/phase-13.4-format-fix.yml
          git add \
            tools/editor/include/Lorenzo2DEditor/AssetBrowserModel.hpp \
            tools/editor/src/AssetBrowserModel.cpp \
            tools/editor/src/AssetPickingModel.cpp \
            tools/editor/src/main.cpp \
            tools/editor/tests/AssetBrowserTests.cpp
          if git diff --cached --quiet; then
            echo "No formatter changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply exact CI formatting"
          git push origin HEAD:phase-13.4-asset-browser-picking
