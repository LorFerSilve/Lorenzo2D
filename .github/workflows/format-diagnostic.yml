name: Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned formatter
        run: python3 -m pip install --break-system-packages clang-format==22.1.3
      - name: Format Phase 14.2 files
        run: clang-format -i include/Lorenzo2D/Assets/AssetManifest.hpp tests/Lorenzo2DResourceTests.cpp
      - name: Upload canonical formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase-14.2-formatted
          path: |
            include/Lorenzo2D/Assets/AssetManifest.hpp
            tests/Lorenzo2DResourceTests.cpp
          if-no-files-found: error
