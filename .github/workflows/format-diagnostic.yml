name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    name: Show clang-format diff
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install formatter
        run: python3 -m pip install --break-system-packages clang-format==22.1.3

      - name: Show formatting diff
        run: |
          clang-format -i \
            src/Lorenzo2D/Renderer/ShaderPostProcessChain2D.cpp \
            tests/Lorenzo2DShaderPostProcessTests.cpp \
            tests/consumers/package/main.cpp \
            tests/consumers/subproject/main.cpp
          git diff -- \
            src/Lorenzo2D/Renderer/ShaderPostProcessChain2D.cpp \
            tests/Lorenzo2DShaderPostProcessTests.cpp \
            tests/consumers/package/main.cpp \
            tests/consumers/subproject/main.cpp
