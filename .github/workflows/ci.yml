name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture-clang-build-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xorg-dev \
            xauth \
            xvfb \
            libharfbuzz-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libudev-dev

      - name: Configure Clang Debug
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DL2D_BUILD_SANDBOX=ON
          -DL2D_BUILD_TESTS=ON
          -DL2D_WARNINGS_AS_ERRORS=ON
          -DL2D_ENABLE_ASAN=OFF
          -DL2D_ENABLE_UBSAN=OFF

      - name: Capture build diagnostics
        shell: bash
        run: |
          set +e
          cmake --build build --parallel > clang-build.log 2>&1
          status=$?
          cat clang-build.log
          printf '%s\n' "$status" > clang-build.status
          exit 0

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: cycle15-clang-build-diagnostics
          path: |
            clang-build.log
            clang-build.status
          if-no-files-found: error
          retention-days: 1
