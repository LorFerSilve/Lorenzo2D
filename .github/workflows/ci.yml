name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-specialized-harness-migration:
    if: ${{ github.head_ref == 'improve/unify-specialized-test-harnesses' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: improve/unify-specialized-test-harnesses
          fetch-depth: 0

      - name: Apply validated migration
        shell: bash
        run: |
          set -euo pipefail
          test -f .cycle13.patch.gz.b64
          git fetch origin master
          base64 --decode .cycle13.patch.gz.b64 | gzip --decompress > /tmp/cycle13.patch
          git apply --check /tmp/cycle13.patch
          git apply /tmp/cycle13.patch
          rm .cycle13.patch.gz.b64
          rm .github/workflows/apply-cycle13.yml
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Commit clean migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify specialized regression test harnesses"
          git push origin HEAD:improve/unify-specialized-test-harnesses
