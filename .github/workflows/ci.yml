name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-cycle15-brace-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: improve/migrate-physics-renderer-assertions
          fetch-depth: 0

      - name: Apply validated macro-argument fix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cycle15-brace-fix.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/cycle15-brace-fix.patch.gz.b64 |
            gzip --decompress > /tmp/cycle15-brace-fix.patch
          git apply --check /tmp/cycle15-brace-fix.patch
          git apply /tmp/cycle15-brace-fix.patch
          git checkout origin/master -- .github/workflows/ci.yml

      - name: Commit brace-safe macro arguments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make vector assertion macro arguments brace-safe"
          git push origin HEAD:improve/migrate-physics-renderer-assertions
