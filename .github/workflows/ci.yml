name: CI

on:
  push:
    branches:
      - master
  pull_request:

# CI only needs to read repository contents. Keep the implicit GITHUB_TOKEN
# read-only so pull requests cannot gain repository write permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC Release
            os: windows-2025
            build_type: Release
            asan: "OFF"
            ubsan: "OFF"
          - name: Linux GCC Release
            os: ubuntu-24.04
            build_type: Release
            cc: gcc
            cxx: g++
            asan: "OFF"
            ubsan: "OFF"
          - name: Linux Clang Debug
            os: ubuntu-24.04
            build_type: Debug
            cc: clang
            cxx: clang++
            asan: "OFF"
            ubsan: "OFF"
          - name: Linux Clang ASan UBSan
            os: ubuntu-24.04
            build_type: Debug
            cc: clang
            cxx: clang++
            asan: "ON"
            ubsan: "ON"

    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_init_order=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xorg-dev \
            xauth \
            xvfb \
            libharfbuzz-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libudev-dev \
            libflac-dev \
            libvorbis-dev

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DL2D_BUILD_SANDBOX=ON
          -DL2D_BUILD_EXAMPLES=ON
          -DL2D_BUILD_TESTS=ON
          -DL2D_BUILD_BENCHMARKS=ON
          -DL2D_WARNINGS_AS_ERRORS=ON
          -DL2D_ENABLE_ASAN=${{ matrix.asan }}
          -DL2D_ENABLE_UBSAN=${{ matrix.ubsan }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DL2D_BUILD_SANDBOX=ON
          -DL2D_BUILD_EXAMPLES=ON
          -DL2D_BUILD_TESTS=ON
          -DL2D_BUILD_BENCHMARKS=ON
          -DL2D_WARNINGS_AS_ERRORS=ON
          -DL2D_ENABLE_ASAN=${{ matrix.asan }}
          -DL2D_ENABLE_UBSAN=${{ matrix.ubsan }}

      - name: Build engine, sandbox, examples, and tests
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir build
          -C ${{ matrix.build_type }}
          --output-on-failure
          --no-tests=error

      - name: Run headless tests (Linux without a display)
        if: runner.os == 'Linux'
        run: |
          unset DISPLAY
          unset WAYLAND_DISPLAY
          ctest --test-dir build \
            -C ${{ matrix.build_type }} \
            --output-on-failure \
            --no-tests=error \
            -L headless

      - name: Run Xvfb-partitioned tests (isolated virtual displays)
        if: runner.os == 'Linux'
        run: |
          mapfile -t xvfb_tests < <(
            ctest --test-dir build -C ${{ matrix.build_type }} --show-only -L xvfb |
              sed -n 's/^[[:space:]]*Test[[:space:]]*#[0-9][0-9]*:[[:space:]]*//p'
          )

          if (( ${#xvfb_tests[@]} == 0 )); then
            echo "No Xvfb tests were registered."
            exit 1
          fi

          for test_name in "${xvfb_tests[@]}"; do
            echo "Running ${test_name} on a fresh Xvfb server"
            xvfb-run --auto-servernum               ctest --test-dir build                 -C ${{ matrix.build_type }}                 --output-on-failure                 --no-tests=error                 --tests-regex "^${test_name}$"
          done

  consumer-integration:
    name: Linux GCC consumer integration
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xorg-dev \
            libharfbuzz-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libudev-dev \
            libflac-dev \
            libvorbis-dev

      - name: Configure as an add_subdirectory dependency
        run: >-
          cmake
          -S tests/consumers/subproject
          -B build-subproject-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DL2D_SOURCE_DIR=${{ github.workspace }}
          -DL2D_WARNINGS_AS_ERRORS=ON

      - name: Build and run subproject consumer
        run: |
          cmake --build build-subproject-consumer --parallel
          ctest --test-dir build-subproject-consumer \
            --output-on-failure \
            --no-tests=error

      - name: Configure installable Lorenzo2D package
        run: >-
          cmake -S . -B build-package
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DL2D_BUILD_SANDBOX=OFF
          -DL2D_BUILD_EXAMPLES=OFF
          -DL2D_BUILD_TESTS=OFF
          -DL2D_WARNINGS_AS_ERRORS=ON
          -DL2D_INSTALL=ON

      - name: Build Lorenzo2D package
        run: cmake --build build-package --parallel

      - name: Configure installable SFML dependency
        run: >-
          cmake
          -S build-package/_deps/sfml-src
          -B build-sfml-package
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DSFML_BUILD_AUDIO=ON
          -DSFML_BUILD_NETWORK=OFF
          -DSFML_BUILD_EXAMPLES=OFF
          -DSFML_BUILD_TEST_SUITE=OFF

      - name: Install SFML and Lorenzo2D
        run: |
          cmake --build build-sfml-package --parallel
          cmake --install build-sfml-package
          cmake --install build-package

      - name: Inspect installed package
        run: |
          test -f install/lib/libLorenzo2D.a
          test -f install/include/Lorenzo2D/ECS/Transform.hpp
          test -f install/include/Lorenzo2D/Core/Version.hpp
          test -f install/include/Lorenzo2D/Core/InputMap.hpp
          test -f install/include/Lorenzo2D/Core/Pointer.hpp
          test -f install/include/Lorenzo2D/Physics/CapsuleCollider2D.hpp
          test -f install/include/Lorenzo2D/Physics/ConvexPolygonCollider2D.hpp
          test -f install/include/Lorenzo2D/Physics/PhysicsQueries2D.hpp
          test -f install/include/Lorenzo2D/Movement/CharacterMotor2D.hpp
          test -f install/include/Lorenzo2D/Movement/PlatformerController2D.hpp
          test -f install/include/Lorenzo2D/Navigation/NavigationGrid2D.hpp
          test -f install/include/Lorenzo2D/Navigation/AStarPathfinder2D.hpp
          test -f install/include/Lorenzo2D/Navigation/PathFollower2D.hpp
          test -f install/include/Lorenzo2D/Animation/Animator.hpp
          test -f install/include/Lorenzo2D/Scene/LevelSerializer.hpp
          test -f install/include/Lorenzo2D/Scene/ComponentCodecRegistry.hpp
          test -f install/include/Lorenzo2D/Assets/AssetId.hpp
          test -f install/include/Lorenzo2D/Audio/AudioSystem.hpp
          test -f install/include/Lorenzo2D/Diagnostics/Diagnostics.hpp
          test -f install/include/Lorenzo2D/Diagnostics/DeterministicReplay.hpp
          test -f install/include/Lorenzo2D/Diagnostics/SubsystemDiagnostics.hpp
          test -f install/include/Lorenzo2D/Save/SaveGame.hpp
          test -f install/include/Lorenzo2D/UI/UiCanvas2D.hpp
          test -f install/include/Lorenzo2D/Renderer/IsometricProjection2D.hpp
          test -f install/include/Lorenzo2D/Tilemap/IsometricTileGrid2D.hpp
          test -f install/include/Lorenzo2D/Tilemap/TileMapData.hpp
          test -f install/include/Lorenzo2D/Tilemap/TiledJsonImporter.hpp
          test -f install/include/Lorenzo2D/Tilemap/TileSet.hpp
          test -f install/lib/cmake/Lorenzo2D/Lorenzo2DConfig.cmake
          test -f install/lib/cmake/Lorenzo2D/Lorenzo2DTargets.cmake
          test -f install/share/licenses/Lorenzo2D/LICENSE
          find install/lib/cmake/Lorenzo2D -maxdepth 1 -type f -print
          if grep -R --include='*.cmake' -F "${{ github.workspace }}" \
              install/lib/cmake/Lorenzo2D; then
            echo "Installed Lorenzo2D package contains a source-tree path"
            exit 1
          fi

      - name: Configure installed-package consumer
        run: >-
          cmake
          -S tests/consumers/package
          -B build-package-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Build and run installed-package consumer
        run: |
          cmake --build build-package-consumer --parallel
          ctest --test-dir build-package-consumer \
            --output-on-failure \
            --no-tests=error

      - name: Configure and build platformer starter
        run: |
          cmake \
            -S templates/platformer \
            -B build-platformer-template \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build build-platformer-template --parallel

      - name: Configure and build point-and-click starter
        run: |
          cmake \
            -S templates/point-and-click \
            -B build-point-and-click-template \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build build-point-and-click-template --parallel

      - name: Configure and build isometric starter
        run: |
          cmake \
            -S templates/isometric \
            -B build-isometric-template \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build build-isometric-template --parallel

      - name: Configure and build top-down starter
        run: |
          cmake \
            -S templates/top-down \
            -B build-top-down-template \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build build-top-down-template --parallel

  quality:
    name: Clang formatting and static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tooling and graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            clang-tidy \
            ninja-build \
            xorg-dev \
            libharfbuzz-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libudev-dev \
            libflac-dev \
            libvorbis-dev
          python3 -m pip install --break-system-packages clang-format==22.1.3

      - name: Configure static analysis
        run: cmake --preset lint

      - name: Check formatting and print exact diff
        run: |
          set +e
          cmake --build build/lint --target format-check
          status=$?
          if (( status != 0 )); then
            for file in \
              src/Lorenzo2D/Assets/ResourceLocator.cpp \
              src/Lorenzo2D/Scene/LevelSerializer.cpp \
              tests/Lorenzo2DFuzzValidation.cpp; do
              formatted="${RUNNER_TEMP}/$(basename "${file}").formatted"
              clang-format "${file}" > "${formatted}"
              echo "::group::clang-format diff: ${file}"
              diff -u "${file}" "${formatted}" || true
              echo "::endgroup::"
            done
          fi
          exit "${status}"

      - name: Build with clang-tidy
        run: cmake --build --preset lint

  coverage:
    name: Linux GCC coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install coverage and graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gcovr \
            ninja-build \
            xorg-dev \
            xauth \
            xvfb \
            libharfbuzz-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libudev-dev \
            libflac-dev \
            libvorbis-dev

      - name: Configure coverage build
        run: cmake --preset coverage

      - name: Build instrumented tests
        run: cmake --build --preset coverage

      - name: Run headless coverage partition
        run: |
          unset DISPLAY
          unset WAYLAND_DISPLAY
          ctest --test-dir build/coverage \
            --output-on-failure \
            --no-tests=error \
            -L headless

      - name: Run Xvfb coverage partition (isolated virtual displays)
        run: |
          mapfile -t xvfb_tests < <(
            ctest --test-dir build/coverage --show-only -L xvfb |
              sed -n 's/^[[:space:]]*Test[[:space:]]*#[0-9][0-9]*:[[:space:]]*//p'
          )

          if (( ${#xvfb_tests[@]} == 0 )); then
            echo "No Xvfb coverage tests were registered."
            exit 1
          fi

          for test_name in "${xvfb_tests[@]}"; do
            echo "Running ${test_name} on a fresh Xvfb server"
            xvfb-run --auto-servernum               ctest --test-dir build/coverage                 --output-on-failure                 --no-tests=error                 --tests-regex "^${test_name}$"
          done

      - name: Generate coverage report
        run: cmake --build --preset coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lorenzo2d-coverage
          path: build/coverage/coverage
          if-no-files-found: error
