name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025
          - name: Linux GCC
            os: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xorg-dev \
            xauth \
            xvfb \
            libharfbuzz-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libudev-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DL2D_BUILD_SANDBOX=ON
          -DL2D_BUILD_TESTS=ON
          -DL2D_WARNINGS_AS_ERRORS=ON

      - name: Build engine, sandbox, and tests
        run: cmake --build build --config Release --parallel

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run tests (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ctest --test-dir build -C Release --output-on-failure
