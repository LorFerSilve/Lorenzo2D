name: Phase 13.4 API cleanup

on:
  push:
    branches:
      - phase-13.4-asset-browser-picking

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-13.4-asset-browser-picking
          fetch-depth: 0
      - name: Restore existing EditorDocument API and convert only at shell boundary
        run: |
          git checkout 4198b8f84716ef805b77efef876b8e1a8ef6a78c -- tools/editor/include/Lorenzo2DEditor/EditorDocument.hpp
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/editor/src/main.cpp')
          text = path.read_text()
          old = 'document.loadFromFile(*options.levelPath)'
          new = 'document.loadFromFile(options.levelPath->string())'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one loadFromFile path call, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Preserve exact CI formatting
        run: |
          python3 -m pip install --break-system-packages clang-format==22.1.3
          clang-format -i tools/editor/src/main.cpp
      - name: Commit cleanup and remove helper workflow
        run: |
          git rm .github/workflows/phase-13.4-api-cleanup.yml
          git add tools/editor/include/Lorenzo2DEditor/EditorDocument.hpp tools/editor/src/main.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep Phase 13.4 document API unchanged"
          git push origin HEAD:phase-13.4-asset-browser-picking
