name: Apply specialized test harness migration

on:
  push:
    branches:
      - improve/unify-specialized-test-harnesses

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.cycle13.patch.gz.b64') != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: improve/unify-specialized-test-harnesses
          fetch-depth: 0

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .cycle13.patch.gz.b64 | gzip --decompress > /tmp/cycle13.patch
          git apply --check /tmp/cycle13.patch
          git apply /tmp/cycle13.patch
          rm .cycle13.patch.gz.b64
          rm .github/workflows/apply-cycle13.yml

      - name: Commit clean migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify specialized regression test harnesses"
          git push origin HEAD:improve/unify-specialized-test-harnesses
